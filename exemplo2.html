<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-6 sm:p-12 font-sans">

    <div class="space-y-2">
      <h3 class="font-bold text-sm text-slate-300">Código HTML:</h3>

    </div>

    <div>
      <a href="index.html#em-linha" class="inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-lg text-sm">
